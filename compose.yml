services:
  postgres:
    image: postgres:16-alpine
    container_name: nexora-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nexora}
      POSTGRES_USER: ${POSTGRES_USER:-nexora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexora}
    ports:
      - "15432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nexora} -d ${POSTGRES_DB:-nexora}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - nexora-net

  meilisearch:
    image: getmeili/meilisearch:v1.11
    container_name: nexora-meilisearch
    restart: unless-stopped
    environment:
      MEILI_ENV: development
      MEILI_NO_ANALYTICS: "true"
      MEILI_MASTER_KEY: ${NEXORA_MEILI_API_KEY:-}
    ports:
      - "7700:7700"
    volumes:
      - meili-data:/meili_data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:7700/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - nexora-net

  redis:
    image: redis:7-alpine
    container_name: nexora-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - nexora-net

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: nexora-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    environment:
      NEXORA_HTTP_ADDR: ":8080"
      NEXORA_DATABASE_URL: "postgres://${POSTGRES_USER:-nexora}:${POSTGRES_PASSWORD:-nexora}@postgres:5432/${POSTGRES_DB:-nexora}?sslmode=disable"
      NEXORA_REDIS_ADDR: "redis:6379"
      NEXORA_MEILI_HOST: "http://meilisearch:7700"
      NEXORA_MEILI_API_KEY: "${NEXORA_MEILI_API_KEY:-}"
      NEXORA_ADMIN_USER: "${NEXORA_ADMIN_USER:-admin}"
      NEXORA_ADMIN_PASS: "${NEXORA_ADMIN_PASS:-admin123}"
      NEXORA_ADMIN_SECRET: "${NEXORA_ADMIN_SECRET:-nexora_admin_secret_signing_key_2026}"
    ports:
      - "8080:8080"
    volumes:
      - ./assets:/app/assets
    networks:
      - nexora-net
    profiles:
      - full

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: nexora-client
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "80:80"
    networks:
      - nexora-net
    profiles:
      - full

volumes:
  postgres-data:
  meili-data:
  redis-data:

networks:
  nexora-net:
    driver: bridge
